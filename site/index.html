<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120f0d">
  <title data-i18n-title="title.search">Барная карта — коктейль по настроению</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html" data-i18n-html="logo">Барная <span>карта</span></a>
    <nav class="nav">
      <a href="index.html" class="active" data-i18n="nav.search">Поиск</a>
      <a href="mybar.html" data-i18n="nav.mybar">Мой бар</a>
      <a href="builder.html" data-i18n="nav.builder">Конструктор</a>
      <a href="substitutes.html" data-i18n="nav.subs">Замены</a>
    </nav>
  </header>

  <main class="page">
    <section class="hero">
      <h1 data-i18n-html="hero.title">Что нальём <em>сегодня?</em></h1>
      <p data-i18n="hero.text">Выберите вкус, крепость и настроение — или просто найдите коктейль по названию или ингредиенту.</p>
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" class="search" type="search" autocomplete="off"
               placeholder="Негрони, мята, освежающий, на вечеринку…" aria-label="Поиск коктейля или тега" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria">
        <div id="suggest" class="suggest" role="listbox"></div>
      </div>
    </section>

    <section id="tagPanel" class="tag-panel" aria-label="Теги"></section>

    <section>
      <div class="results-head">
        <h2 data-i18n="results.title">Коктейли</h2>
        <span id="count" class="count"></span>
        <div id="active" class="active-filters"></div>
        <button id="clear" class="clear-btn" hidden data-i18n="results.clear">сбросить всё</button>
      </div>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <script src="data/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
